    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f5f7fa;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin-bottom: 20px;
        text-align: center;
      }

      .controls {
        width: 100%;
        max-width: 700px;
        margin-bottom: 15px;
      }

      .label-and-button {
        display: flex;
      }
      .label-and-button.hide {
        display: none;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 15px;
      }

      .buttons button {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #0078d4;
        color: white;
        cursor: pointer;
      }

      .buttons button:hover {
        background: #005fa3;
      }

      .custom-select {
        position: relative;
        width: 100%;
      }

      .selected-value {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        text-align: left;
      }

      .dropdown-list {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        max-height: 40vh;
        overflow-y: auto;
        display: none;
        z-index: 1000;
      }

      .dropdown-list.show {
        display: block;
      }

      .dropdown-item {
        padding: 12px;
        cursor: pointer;
      }

      .dropdown-item:hover {
        background: #f0f4ff;
      }

      .table-div {
        width: 100%;
        max-width: 700px;
        height: 65vh;
        overflow: auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .multiple {
        max-width: 300px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #0078d4;
        color: white;
        position: sticky;
        top: 0;
      }

      th,
      td {
        padding: 10px;
        text-align: right;
        border: 1px solid #eee;
      }

      tr:nth-child(even) {
        background: #fafafa;
      }

      .series {
        padding-right: 50px;
      }

      @media (max-width: 600px) {
        .buttons button {
          flex: 1 1 calc(50% - 5px);
        }
      }
    </style>
  </head>
  <body>
    <h1>Math Reference Tables</h1>

    <div class="controls">
      <div class="buttons">
        <button onclick="showMultiplication()">Multiplication</button>
        <button onclick="showSquareCube()">Squares & Cubes</button>
        <button onclick="showPrimeSquareCube()">Prime Numbers</button>
      </div>

      <div class="custom-select">
        <div id="tableMenu" class="label-and-button">
          <label>Choose Table Number</label
          ><button id="selectedValue" class="selected-value">Table 1 ▼</button>
        </div>
        <div id="dropdownList" class="dropdown-list"></div>
      </div>
    </div>

    <div id="tableDiv" class="table-div multiple">
      <table id="tableContainer"></table>
    </div>

    <script>
      const tableContainer = document.getElementById("tableContainer");
      const selectedValue = document.getElementById("selectedValue");
      const dropdownList = document.getElementById("dropdownList");

      let currentTable = 1;

      for (let i = 1; i <= 99; i++) {
        const item = document.createElement("div");
        item.className = "dropdown-item";
        item.textContent = `Table ${i}`;

        item.addEventListener("click", () => {
          currentTable = i;

          selectedValue.textContent = `Table ${i} ▼`;

          dropdownList.classList.remove("show");

          generateTable(i);
        });

        dropdownList.appendChild(item);
      }

      selectedValue.addEventListener("click", () => {
        dropdownList.classList.toggle("show");
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".custom-select")) {
          dropdownList.classList.remove("show");
        }
      });

      function clearTable() {
        tableContainer.innerHTML = "";
      }

      function generateTable(number) {
        clearTable();
        document.addEventListener("click", (e) => {
          tableMenu.classList.remove("hide");
          tableDiv.classList.add("multiple");
        });

        for (let i = 1; i <= 20; i++) {
          let row = document.createElement("tr");

          row.innerHTML = `
              <td class="series">${i}</td>
              <td class="symbol">×</td>
              <td>${number}</td>
              <td class="symbol">=</td>
              <td class="series"><strong>${i * number}</strong></td>
          `;

          tableContainer.appendChild(row);
        }
      }

      function showMultiplication() {
        generateTable(currentTable);
      }

      function showSquareCube() {
        clearTable();
        document.addEventListener("click", (e) => {
          tableMenu.classList.add("hide");
          tableDiv.classList.remove("multiple");
        });

        tableContainer.innerHTML = `
          <tr>
              <th>Number</th>
              <th>Square</th>
              <th>Cube</th>
          </tr>
      `;

        for (let i = 1; i <= 100; i++) {
          let row = document.createElement("tr");

          row.innerHTML = `
              <td>${i}</td>
              <td>${i * i}</td>
              <td>${i * i * i}</td>
          `;

          tableContainer.appendChild(row);
        }
      }

      function isPrime(num) {
        if (num < 2) return false;

        for (let i = 2; i <= Math.sqrt(num); i++) {
          if (num % i === 0) {
            return false;
          }
        }

        return true;
      }

      function showPrimeSquareCube() {
        clearTable();
        document.addEventListener("click", (e) => {
          tableMenu.classList.add("hide");
          tableDiv.classList.remove("multiple");
        });

        tableContainer.innerHTML = `
          <tr>
              <th>Prime</th>
              <th>Square</th>
              <th>Cube</th>
          </tr>
      `;

        for (let i = 2; i <= 1000; i++) {
          if (isPrime(i)) {
            let row = document.createElement("tr");

            row.innerHTML = `
                  <td>${i}</td>
                  <td>${i ** 2}</td>
                  <td>${i ** 3}</td>
              `;

            tableContainer.appendChild(row);
          }
        }
      }
      generateTable(1);
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Math Tables Online",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "description": "Multiplication tables, square numbers, cube numbers and square cube for prime number reference tool."
      }
    </script>
  </body>
</html>
